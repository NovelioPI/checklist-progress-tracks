name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm test

      - run: npm run build

      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            styles.css

      - run: |
          NOTES="Turns tagged checkboxes under headings into visual multi-track progress bars for Obsidian.

          ## Key features
          - Live progress bars: add a \"<Label>: [!progress_bar]\" line under any heading and it renders inline, computed from the checkboxes below it
          - Multi-track support: route checkboxes to different tracks with #tags, configurable per vault in settings
          - Skip tag to exclude specific checkboxes from every track's totals
          - Dashboard view aggregating progress bars across the whole vault, with click-through to the source note
          - Works in both Reading view and Live Preview

          main.js and styles.css are built by this workflow and carry verifiable build provenance attestations (Sigstore/SLSA). See the tag message below for what changed in this release."

          gh release create "${GITHUB_REF_NAME}" \
            main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" \
            --notes "$NOTES" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
