name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm test

      - run: npm run build

      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            styles.css

      - run: |
          NOTES="Turns tagged checkboxes under headings into visual multi-track progress bars for Obsidian.

          main.js and styles.css are built by this workflow and carry verifiable build provenance attestations (Sigstore/SLSA). See the tag message below for what changed in this release."

          gh release create "${GITHUB_REF_NAME}" \
            main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" \
            --notes "$NOTES" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
